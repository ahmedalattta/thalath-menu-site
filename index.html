  --ink:#3b1f15; --paper:#dcd8d8; --sage:#becbb7; --sage2:#acb6a7; --terra:#d6614b; --terra2:#a63f2d; --brown:#633d2c;
  --line:rgba(59,31,21,.18);
  --f:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overflow:clip;background:#24130d;color:var(--ink);font-family:var(--f)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;overflow:clip;background:var(--paper)}
.en{direction:ltr;unicode-bidi:isolate}
.logo{display:inline-block;background:currentColor;aspect-ratio:664/223;
  -webkit-mask:var(--logo-mask) center/contain no-repeat;mask:var(--logo-mask) center/contain no-repeat}
.vine{display:block;background:currentColor;aspect-ratio:492/50;
  -webkit-mask:var(--vine-mask) center/contain no-repeat;mask:var(--vine-mask) center/contain no-repeat}

/* ---------- book ---------- */
.book{position:absolute;inset:0;perspective:1800px}
.page{position:absolute;inset:0;overflow:hidden;background:var(--paper);transform-origin:right center;backface-visibility:hidden;visibility:hidden;will-change:transform}
.page.dark{background:var(--ink);color:var(--paper)}
.page.on{visibility:visible;z-index:2}
.page.under{visibility:visible;z-index:1}
.page .scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(18px + var(--st)) 22px calc(96px + var(--sb))}
.page::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(to left,rgba(0,0,0,0),rgba(0,0,0,.22))}
.page.flip-out{animation:flipOut .75s cubic-bezier(.45,.05,.3,1) forwards;z-index:3;visibility:visible}
.page.flip-out::after{animation:shade .75s forwards}
.page.flip-in{animation:flipIn .75s cubic-bezier(.45,.05,.3,1) forwards;z-index:3;visibility:visible}
.page.flip-in::after{animation:shade .75s reverse forwards}
@keyframes flipOut{to{transform:rotateY(178deg)}}
@keyframes flipIn{from{transform:rotateY(178deg)}to{transform:rotateY(0)}}
@keyframes shade{60%{opacity:1}100%{opacity:.5}}

/* page header (as in the artboards) */
.ph{display:flex;justify-content:space-between;align-items:flex-start;min-height:34px}
.ph .brand{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.ph .brand .logo{width:46px}
.ph .brand small{font-size:10px;font-weight:500}
.ph .brand b{font-size:17px;font-weight:500}
.ph .tag{font-size:11px;font-weight:500}
.hero{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.hero .t{flex:1;min-width:0}
.hero h2{font-size:42px;line-height:1.15;font-weight:500}
.hero h2.bold{font-weight:700}
.hero h2.long{font-size:31px}
.hero .sub{font-size:15px;font-weight:500;color:var(--terra);letter-spacing:.02em;margin-top:2px}
.hero .sub.ink{color:var(--ink);font-weight:700;font-size:13px;letter-spacing:.04em}
.pill{display:inline-block;margin-top:8px;background:var(--ink);color:var(--paper);font-size:10px;font-weight:500;padding:3px 12px;border-radius:999px}
.pic{position:relative;width:118px;height:118px;flex:none}
.pic::before{content:"";position:absolute;inset:8px 4px 4px 8px;border-radius:50%;background:var(--sage)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(59,31,21,.18))}
.pic i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--terra)}
.pic i:nth-of-type(1){top:4px;right:16px}.pic i:nth-of-type(2){bottom:20px;left:0;width:9px;height:9px}
.rule{height:2px;background:var(--ink);margin:16px 0 4px}

.items{list-style:none}
.item{padding:11px 0 10px;border-bottom:1px solid var(--line);cursor:pointer;opacity:0;transform:translateY(6px)}
.page.revealed .item{animation:rise .45s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.item .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item .nm{font-size:18px;font-weight:500;line-height:1.3}
.item .new{display:inline-block;font-size:10px;background:var(--terra);color:var(--paper);padding:0 8px;border-radius:999px;margin-inline-start:6px;vertical-align:3px;line-height:1.7}
.item .pr{font-size:18px;font-weight:500;white-space:nowrap;direction:ltr}
.item .pr sup,.cur{font-size:9px;color:var(--terra);font-weight:500;margin-left:2px;vertical-align:6px}
.item .pr.b{font-weight:700;font-size:15px}
.item .pr.b span{font-size:15px}
.item .e2{display:block;font-size:9.5px;font-weight:500;letter-spacing:.04em;margin-top:1px;text-align:right}
.item .nut{display:block;font-size:9.5px;margin-top:3px;text-align:right;white-space:pre;opacity:.85}
.item .d{font-size:13px;margin-top:5px;line-height:1.6}
.item .d-en{display:block;font-size:10px;opacity:.8;text-align:right}
.item .note{font-size:12.5px;font-weight:500;margin-top:4px}
.item.with-img{display:flex;gap:12px;align-items:center}
.item.with-img .body{flex:1;min-width:0}
.item.with-img .thumb{width:84px;flex:none;text-align:center}
.item.with-img .thumb img{width:84px;height:84px;object-fit:contain}
.item.with-img .thumb .pr{display:block;font-weight:700;font-size:20px;margin-top:2px}
.item .e2.terra{color:var(--terra)}
.grp-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 2px}
.grp-h b{font-size:21px;font-weight:700}
.grp-h span{font-size:11px;font-weight:500;color:var(--terra2)}
.intro{margin-top:14px;font-size:14px;font-weight:500}
.intro small{display:block;font-size:9.5px;letter-spacing:.04em;margin-top:2px}
.banner{margin-top:18px;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px;text-align:center;font-size:13px;font-weight:500;white-space:pre}
.banner small{display:block;color:var(--sage);font-size:8.5px;letter-spacing:.06em;margin-top:3px}
.notes{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:10px;border-top:1px solid var(--ink);font-size:9.5px;font-weight:500}
.notes span:last-child{white-space:pre}
.handle{text-align:center;font-size:10px;font-weight:500;margin-top:14px;opacity:.8}

/* specials */
.feature{margin-top:24px;background:var(--ink);border-radius:4px;padding:26px 22px 30px;color:var(--paper);cursor:pointer;min-height:270px;display:flex;flex-direction:column}
.feature .l{color:var(--sage);font-size:18px;font-weight:500}
.feature .n{font-size:34px;font-weight:500;margin-top:22px}
.feature .p{color:var(--sage);font-size:30px;font-weight:500;margin-top:auto;padding-top:30px}
.feature .p small{font-size:16px}

/* index */
.idx-h{font-size:40px;font-weight:500;margin-top:10px}
.idx-h small{display:block;color:var(--terra);font-size:13px;letter-spacing:.06em}
.idx a{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.idx .no{font-size:12px;font-weight:500;color:var(--terra);width:22px}
.idx .tt{font-size:19px;font-weight:500;flex:1}
.idx .ee{font-size:9.5px;font-weight:500;letter-spacing:.04em;opacity:.75}

/* events */
.month{font-size:22px;font-weight:500;margin-top:4px}
.ev{padding:12px 14px;margin-top:8px}
.ev:nth-child(odd){background:var(--sage)}
.ev h4{font-size:21px;font-weight:500;line-height:1.3}
.ev p{font-size:13px;font-weight:500}
.evg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.evc{display:flex;flex-direction:column;background:#fff;border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.evc img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#eee}
.evb{padding:9px 10px 11px;display:flex;flex-direction:column;gap:4px;flex:1}
.evb h4{font-size:14.5px;font-weight:600;line-height:1.3}
.evb p{font-size:11px;font-weight:500;opacity:.75;line-height:1.4}

.sb-card{position:relative;flex:none;margin:0 11% calc(80px + var(--sb));z-index:2;background:#fff;color:var(--ink);border-radius:24px;padding:16px 18px 16px;

.sb-head{display:flex;justify-content:space-between;align-items:center}
.sb-p{font-size:20px;font-weight:600;line-height:1}.sb-p small{font-size:11px;color:var(--terra);margin-inline-start:3px;vertical-align:8px}

/* index page — centered */

.ixg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:22px 16px 6px;text-align:start}

$('#find').onclick=()=>{$('#q').value='';renderS();$('#search').classList.add('show')};
$('#qx').onclick=()=>$('#search').classList.remove('show');
$('#q').oninput=e=>renderS(e.target.value);
</script>
